name: Base Image Vulnerability Scan (Grype)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  grype-base-scan:
    name: Scan Base Image with Grype
    runs-on: ubuntu-latest

    steps:
      - name: Install Grype
        run: |
          echo "📦 Installing Grype..."
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh
          sudo mv grype /usr/local/bin/
          grype version

      - name: Scan base image and print all findings
        env:
          IMAGE_NAME: openjdk:8-jdk-alpine
        run: |
          echo "🔍 Scanning base image: $IMAGE_NAME"
          grype $IMAGE_NAME -o table || true
          echo ""
          echo "--------------------------------------------------"
          echo "📊 JSON Report Preview (Top 20 Findings)"
          echo "--------------------------------------------------"
          grype $IMAGE_NAME -o json | jq '.matches[:20]' || true

      - name: Generate full vulnerability reports
        if: always()
        env:
          IMAGE_NAME: openjdk:8-jdk-alpine
        run: |
          echo "📄 Generating full vulnerability reports..."
          mkdir -p reports
          grype $IMAGE_NAME -o json > reports/grype-report.json
          grype $IMAGE_NAME -o table > reports/grype-report.txt
          echo "✅ Reports generated in ./reports/"

      - name: Upload scan reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-scan-reports
          path: reports/
