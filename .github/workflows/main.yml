scan-sdk-image:
    runs-on: ubuntu-latest    
    steps:
    - name: Scan SDK base image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: mcr.microsoft.com/dotnet/sdk:8.0
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
